name: CI

on:
  pull_request:
    branches: [develop, production]
  push:
    branches: [develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: minitman
          POSTGRES_PASSWORD: minitman
          POSTGRES_DB: minitman
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U minitman -d minitman"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # CI uses the same file layout as a laptop: the example values are the local defaults.
      - run: cp .env.example .env.development
      # The gitleaks binary is free; the marketplace action needs a paid licence for organisations.
      - name: Secret scan
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm check:banned-terms
      - name: Apply schema to PostgreSQL 16 + PostGIS
        run: pnpm db:migrate
      - name: Generated API client is up to date
        run: pnpm contracts:generate && git diff --exit-code packages/contracts
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
