name: CI

on:
  pull_request:
    branches: [develop, production]
  push:
    branches: [develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the workflow token can only read the code. No job may write.
permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: minitman
          POSTGRES_PASSWORD: minitman
          POSTGRES_DB: minitman
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U minitman -d minitman"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Frozen lockfile: CI installs exactly what was reviewed. Build scripts run only for the
      # packages allow-listed in pnpm-workspace.yaml (strictDepBuilds fails on any other).
      - run: pnpm install --frozen-lockfile
      - name: Dependency audit (high and critical)
        run: pnpm audit:deps
      # CI uses the same file layout as a laptop: the example values are the local defaults.
      - run: cp .env.example .env.development
      # The gitleaks binary is free; the marketplace action needs a paid licence for organisations.
      - name: Secret scan
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm check:banned-terms
      - name: Workflow and workspace rules
        run: pnpm check:repo
      - name: Apply schema to PostgreSQL 16 + PostGIS
        run: pnpm db:migrate
      - name: Apply database roles (least privilege)
        run: pnpm db:roles
      - name: Generated API client is up to date
        run: pnpm contracts:generate && git diff --exit-code packages/contracts
      - name: No breaking API change
        if: github.event_name == 'pull_request'
        run: node scripts/check-contract-breaking.mjs "origin/${{ github.base_ref }}"
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: No server-only settings in client bundles
        run: pnpm check:client-bundles
