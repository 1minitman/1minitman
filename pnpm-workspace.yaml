packages:
  - apps/*
  - packages/*

# One version of every shared dependency, declared once. Workspaces use "catalog:".
catalog:
  typescript: 6.0.3
  zod: ^4.6.7
  react: 19.3.0
  react-dom: 19.3.0
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  vite: ^8.3.8
  tailwindcss: ^4.3.5
  '@tailwindcss/vite': ^4.3.5
  hono: ^4.13.21
  '@hono/zod-openapi': ^1.6.3
  drizzle-orm: ^0.45.4
  postgres: ^3.4.7
  bun: 1.4.5
  '@types/bun': ^1.4.5
  '@tanstack/react-query': ^5.108.4
  # React Native is pinned to the exact version the Expo SDK ships with, everywhere.
  react-native: 0.88.1

# pnpm 10 runs install scripts only for packages listed here.
onlyBuiltDependencies:
  - bun
  - esbuild
  - sharp
  - '@tailwindcss/oxide'
  - unrs-resolver

# Expo / React Native need a flat node_modules layout.
nodeLinker: hoisted
strictPeerDependencies: false
autoInstallPeers: true

# Supply-chain guards.
# An install fails if a dependency wants to run a build script and is not in onlyBuiltDependencies.
strictDepBuilds: true
# Never resolve a version published less than 3 days ago (minutes): most malicious releases are
# caught and unpublished within that window.
minimumReleaseAge: 4320
# Refuse a version whose publishing trust is weaker than an earlier version of the same package
# (for example signed provenance yesterday, a plain token upload today: a stolen-token pattern).
trustPolicy: no-downgrade
