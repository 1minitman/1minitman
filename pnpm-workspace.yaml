packages:
  - apps/*
  - packages/*

# One version of every shared dependency, declared once. Workspaces use "catalog:".
catalog:
  typescript: 6.0.3
  zod: ^4.6.7
  react: 19.3.0
  react-dom: 19.3.0
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  vite: ^8.3.8
  tailwindcss: ^4.3.5
  '@tailwindcss/vite': ^4.3.5
  hono: ^4.13.21
  '@hono/zod-openapi': ^1.6.3
  drizzle-orm: ^0.45.4
  postgres: ^3.4.7
  bun: 1.4.5
  '@types/bun': ^1.4.5
  '@tanstack/react-query': ^5.108.4

# pnpm 10 runs install scripts only for packages listed here.
onlyBuiltDependencies:
  - bun
  - esbuild
  - sharp
  - '@tailwindcss/oxide'
  - unrs-resolver

# Expo / React Native need a flat node_modules layout.
nodeLinker: hoisted
strictPeerDependencies: false
autoInstallPeers: true
